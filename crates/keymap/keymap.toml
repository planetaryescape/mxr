# Overlays: pickers, confirms, previews, prompts and sheets (blueprint 35,
# "Overlays share one grammar"). An open overlay owns every key, so the
# overlay reads these itself in both clients; no dispatcher, palette or
# keys.toml remap reaches them. A TUI runner test
# (`screen_keys_are_what_the_definition_says`) holds each TUI overlay's
# handler to its entries, and the web's dialogs read theirs with
# `definedKeys`, except an action marked `web_native`, whose keys the browser
# or the dialog primitive gives (Esc closing a dialog, Enter pressing the
# focused button, Tab moving between buttons). `inline:` names act in place;
# `lit:run` runs whichever option is highlighted.

