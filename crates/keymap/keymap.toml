[[action.tui]]
name = "Compose"
keys = ["c"]
contexts = ["list", "reader", "place", "todo", "catchup", "expired", "now", "archive", "reading", "reading-reader", "updates", "search", "search-preview", "focus"]

[[action]]
id = "mail.undo"
# Raycast: macOS undo; Cmd+U would be the web letter.
raycast_key = "Cmd+z"
label = "Undo last action"
description = "Reverse the last archive, trash, move, label change or send (about 60 seconds)"
group = "Mail"
scopes = ["global"]
keys = ["u", "z"]
note = "z also undoes, for Gmail muscle memory"

[[action.tui]]
name = "UndoLastMutation"
keys = ["u"]
contexts = ["list", "reader", "sidebar", "place", "todo", "catchup", "now", "messages", "archive", "reading", "reading-reader", "updates", "search", "search-preview", "arrivals-list", "focus"]

# The TUI holds z elsewhere while `z z` says where it went; Focus & reply
# never had it, so z undoes there as on the web.
[[action.tui]]
name = "UndoLastMutation"
keys = ["z"]
contexts = ["focus"]

