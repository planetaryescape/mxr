[package]
name = "mxr-reading"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal: Reading mode extraction, fade, ranking and the guarded article fetch for mxr"
publish = false

[lints]
workspace = true

[dependencies]
mxr-reader = { workspace = true }
# is_loopback_endpoint: the article fetch refuses what an LLM call would.
mxr-llm = { workspace = true }
chrono = { workspace = true }
# Readability.js port for fetched web articles (chosen over readability,
# readabilityrs and readability-rust: maintained, MIT, pure Rust).
dom_smoothie = "0.18"
# scraper's tree type, for the one-pass walk over an issue's HTML.
ego-tree = "0.11"
once_cell = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
