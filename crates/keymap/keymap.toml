# mxr's key definition: every shortcut in every client (blueprint chapter 35, D169).
#
# Each [[action]] is one thing a key can do. Its web keys and scopes are what the
# web app binds; each [[action.tui]] is how the TUI binds it today, by the TUI
# action name its dispatcher returns and the contexts it works in. Until K1c the
# TUI still dispatches from its own code; `cargo test -p mxr-keymap` fails when
# this file and `docs/reference/tui-keymap.json` or the web registry disagree.

# Global navigation and shell. Chords follow the TUI's live key handler
# (crates/tui/src/input.rs): g + a lowercase letter for mail places and modes,
# g + a capital for tools (blueprint 35, D166).
# Web-only destinations use letters the TUI leaves free, and every deliberate
# difference carries a `note` that help displays.
[[action]]
id = "shell.command-palette"
label = "Command palette"
description = "Run any action by name"
group = "Navigate"
scopes = ["global"]
keys = ["Mod+k", ":"]
mac_keys = ["Ctrl+p"]
hide_in_palette = true
note = "Ctrl+P works on macOS only, where it is not the browser's Print; the TUI's Mod+K is Ctrl+k"

[[action.tui]]
name = "OpenCommandPalette"
keys = [":", "Ctrl+k", "Ctrl+p"]
contexts = ["list", "reader", "sidebar", "place", "todo", "catchup", "expired", "now", "messages", "archive", "reading", "reading-reader", "updates"]

[[action]]
id = "shell.search-palette"
label = "Search mail"
description = "Search the whole local archive"
group = "Search"
scopes = ["global"]
keys = ["/"]

[[action.tui]]
name = "OpenGlobalSearch"
keys = ["/"]
contexts = ["list", "reader", "sidebar", "place", "todo", "catchup", "expired", "now", "messages", "reading", "reading-reader", "updates"]

[[action]]
id = "shell.help"
label = "Keyboard help"
description = "Every shortcut for the current view"
