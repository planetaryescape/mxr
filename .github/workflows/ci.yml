name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review isn't a default type: without it, marking a draft ready
    # doesn't start the full suite that drafts skip.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Pushes to main group by commit
# instead, so no main run is ever cancelled or queued behind another: each push
# only tests its own diff (github.event.before..sha in `changes`), so a
# cancelled or superseded main run leaves that commit's suites unrun for good.
# Sharing one group per ref cancelled nearly every apps/web merge, because the
# release-please merge lands minutes later, and the full Web E2E matrix never
# finished on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: Detect Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      apps_web: ${{ steps.filter.outputs.apps_web }}
      docs: ${{ steps.filter.outputs.docs }}
      expensive: ${{ steps.filter.outputs.expensive }}
      classifier: ${{ steps.filter.outputs.classifier }}
      rust_version: ${{ steps.rust-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: rust-version
        name: Read workspace Rust version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("Cargo.toml", "rb") as cargo_toml:
              print(f"version={tomllib.load(cargo_toml)['workspace']['package']['rust-version']}")
          PY
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="HEAD"
          else
            base="${BEFORE}"
            head="${SHA}"
          fi

          scripts/ci_change_scope.sh "${EVENT_NAME}" "${base}" "${head}" >> "${GITHUB_OUTPUT}"

  deny:
    name: cargo deny
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  secret-scan:
    name: Secret Scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
      - name: Install gitleaks
        env:
          # Avoid observed HTTP/2 stream resets during checksum downloads.
          GODEBUG: http2client=0
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan checked-in files
        run: |
          set -euo pipefail
          scan_dir="${RUNNER_TEMP}/gitleaks-tree"
          mkdir -p "${scan_dir}"
          git ls-files -z | tar --null -T - -cf - | tar -x -C "${scan_dir}"
          gitleaks dir "${scan_dir}" --redact=20 --verbose --max-target-megabytes=2
      - name: Scan git history
        run: gitleaks git . --redact=20 --verbose

  architecture:
    name: Architecture Boundaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_architecture_boundaries.sh

  # examples/adapter-skeleton is excluded from the root workspace so it stays
  # copyable as a standalone template — which also means `cargo check
  # --workspace` never builds it, and a provider-trait refactor can rot it
  # silently. Build it here so the adapter example fails loudly instead.
  adapter-skeleton:
    name: Adapter Skeleton Example
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    defaults:
      run:
        working-directory: examples/adapter-skeleton
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/adapter-skeleton
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # examples/transport-skeleton is likewise excluded from the root workspace so
  # it stays a copyable standalone template; a transport-trait refactor could rot
  # it silently. Build it here so the transport example fails loudly instead.
  transport-skeleton:
    name: Transport Skeleton Example
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    defaults:
      run:
        working-directory: examples/transport-skeleton
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/transport-skeleton
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release-gates:
    name: Release Gate Scripts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/release_version_gate_test.sh
      - run: bash scripts/pre_pr_rust_gate_test.sh
      - run: bash scripts/release_gmail_oauth_gate_test.sh
      - run: bash scripts/release_workflow_test.sh
      - run: bash scripts/publish_github_release_test.sh
      - run: bash scripts/provider_smoke_workflow_test.sh
      - run: bash scripts/v1_launch_proof_cleanup_test.sh
      - run: bash scripts/ci_change_scope_test.sh
      - run: bash scripts/ci_workflow_test.sh

  fmt:
    name: Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      # Also the workspace type check: clippy compiles every target, so a
      # separate `cargo check --workspace --all-targets` job only repeated it.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # LLM tracing is a developer build (`--features langfuse`): keep it
      # working, and keep it out of the feature set release.yml ships.
      - run: cargo test -p mxr-llm --features langfuse --test trace_spans --locked
      - run: cargo test -p mxr-assistant --features langfuse --lib --locked -- a_tool_span
      - name: Release builds carry no tracing code
        # The tree goes through a variable so a failing `cargo tree` fails the
        # step instead of reading as "no opentelemetry".
        run: |
          tree="$(cargo tree -p mxr --features semantic-local,web-ui -e normal --locked)"
          if grep -q opentelemetry <<<"$tree"; then
            echo "opentelemetry is in the release dependency tree; tracing must stay behind the langfuse feature" >&2
            exit 1
          fi

  test:
    name: Test (fast / no semantic)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    # On a PR, skip it while the PR is a draft — draft pushes still get the
    # cheap jobs (fmt/clippy/etc.) on every push; this one is expensive enough
    # that it should run once near the end of iteration (mark the PR ready),
    # not on every rebase/fixup push.
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      # `Test (semantic-local)` runs the whole workspace with the feature
      # release.yml ships. Without it only mxr-semantic (its `local` cfgs) and
      # mxr (its `semantic-local` cfgs, and every search that asks
      # `should_use_semantic`) compile differently; no other crate depends on
      # mxr-semantic, so their tests here would repeat that job's.
      - run: cargo nextest run -p mxr -p mxr-semantic
      - name: Verify supervised Linux ownership and optional model diagnostics
        run: |
          cargo build -p mxr
          python3 scripts/s08c_headless_smoke.py target-cli/debug/mxr

  test-semantic:
    name: Test (semantic-local)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    # See the draft-skip note on the `test` job above.
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo nextest run --workspace --features semantic-local

  # A release-please version bump skips the Rust suites
  # (scripts/ci_change_scope.sh) but changes which moved keys the clients
  # announce: from a move's `until` on, mxr ignores it (blueprint 35, D171).
  # The keymap crate builds in seconds, so its check runs whenever those
  # suites don't. An expired move never fails it; the job only warns, and
  # .github/workflows/prune-key-moves.yml deletes expired moves weekly.
  keymap:
    name: Key definition
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mxr-keymap
      - name: Warn about expired key moves
        run: cargo run --quiet -p mxr-keymap --example expired_key_moves

  # Grades every email of the 50,000-message demo (`mxr classify eval --set
  # full`) through the same post-sync work the daemon runs, and compares the
  # per-question accuracy, the held-out accuracy and the mismatch clusters with
  # the recorded snapshot. The test is `#[ignore]`d so the workspace test jobs
  # skip it. It runs, on a PR or a push to main, only when the code that
  # decides a graded answer changes (the list is in scripts/ci_change_scope.sh),
  # and on a manual run; any other change skips it. Like the other heavy jobs
  # it waits for a PR to leave draft.
  classifier-eval:
    name: Classifier Eval (full set)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.classifier == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # About 12 minutes on a usual runner; a runner 2.5 times slower took 29
    # (docs/issues/classify-eval-full-near-timeout.md). The limit only stops a
    # hung job: a slower classifier fails the test's work-per-sync budget,
    # which a slow runner doesn't move.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Grade the full set
        env:
          INSTA_UPDATE: new
        run: |
          set -o pipefail
          cargo test -p mxr --lib -- --ignored --exact handler::tests::classify_eval_full::the_full_set_is_graded_on_the_whole_demo --nocapture 2>&1 | tee classify-eval-full.log
      # Runs after a timeout too: the rows of the stages that finished say
      # whether the runner or the classifier was slow.
      - name: Summarise the timings
        if: always()
        run: |
          {
            echo "### Classifier eval timings"
            echo
            sed -n 's/^ *Finished \(.*\)$/Compile: \1/p' classify-eval-full.log
            echo
            sed -n 's/^classify-eval-timing: //p' classify-eval-full.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the grading log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classify-eval-full-log
          path: |
            classify-eval-full.log
            crates/daemon/src/handler/tests/snapshots/mxr__handler__tests__classify_eval_full__the_full_set_is_graded_on_the_whole_demo.snap.new
          retention-days: 3

  test-quality-audit:
    name: Test Quality Audit (non-blocking)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.expensive == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test_quality_audit_test.sh
      - run: scripts/test_quality_audit.sh
      - uses: actions/upload-artifact@v7
        with:
          name: test-quality-audit
          path: target/test-quality

  test-quality-gate:
    name: Test Quality Gate (changed files)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/test_quality_audit_test.sh
      - run: scripts/test_quality_audit.sh --strict --changed-only --base-ref origin/${{ github.base_ref }}

  build-e2e-daemon:
    name: Build E2E Daemon
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: |
      (needs.changes.outputs.apps_web == 'true' || needs.changes.outputs.expensive == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build mxr for the Playwright daemon
        run: cargo build -p mxr
      - name: Upload E2E mxr binary
        uses: actions/upload-artifact@v7
        with:
          name: mxr-e2e-bin
          path: target-cli/debug/mxr
          retention-days: 1

  raycast:
    name: Raycast Typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    # It imports the web app's generated bridge types, so any web change can break it.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.expensive == 'true'
    defaults:
      run:
        working-directory: apps/raycast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/raycast/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  web-tests:
    name: Web Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.expensive == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=moderate
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

  web-e2e:
    name: Web E2E
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes, test, web-tests, build-e2e-daemon]
    # See the draft-skip note on the `test` job above — this is the single
    # most expensive job in the matrix (full Playwright suite plus the
    # production-build speed gate), so it's the main target of that gate.
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.apps_web == 'true' || needs.changes.outputs.expensive == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # One runner: the suite is a handful of core journeys (apps/web/e2e/README.md)
    # against a prebuilt daemon binary.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download E2E mxr binary
        uses: actions/download-artifact@v8
        with:
          name: mxr-e2e-bin
          path: ${{ github.workspace }}/target-cli/debug
      - name: Set daemon binary path and permissions
        run: |
          if [ -f "${GITHUB_WORKSPACE}/target-cli/debug/mxr" ]; then
            chmod +x "${GITHUB_WORKSPACE}/target-cli/debug/mxr"
            echo "MXR_E2E_BIN=${GITHUB_WORKSPACE}/target-cli/debug/mxr" >> "$GITHUB_ENV"
          elif [ -f "${GITHUB_WORKSPACE}/target-cli/debug/target-cli/debug/mxr" ]; then
            mv "${GITHUB_WORKSPACE}/target-cli/debug/target-cli/debug/mxr" "${GITHUB_WORKSPACE}/target-cli/debug/mxr"
            chmod +x "${GITHUB_WORKSPACE}/target-cli/debug/mxr"
            echo "MXR_E2E_BIN=${GITHUB_WORKSPACE}/target-cli/debug/mxr" >> "$GITHUB_ENV"
          fi
      # One worker: every spec shares the FakeProvider daemon's mailbox.
      # Pull requests and main run the same suite (e2e:engine is an alias of e2e).
      - name: Run the Chromium suite (bounded, with progress log)
        run: |
          set -o pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            timeout --signal=TERM --kill-after=30s 20m npm run e2e:engine -- --workers=1 --shard=${{ matrix.shard }}/1 2>&1 | tee playwright-run.log
          else
            timeout --signal=TERM --kill-after=30s 45m npm run e2e -- --workers=1 --shard=${{ matrix.shard }}/1 2>&1 | tee playwright-run.log
          fi
      # Keep functional failures separate from the speed traces below.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-run.log
          retention-days: 3
      # The keydown-to-paint gate against a production build (about 20 s):
      # the development build's owner-stack capture isn't what users run.
      # Run only on shard 1 to avoid duplicate work; allow 75ms on shared CI runners.
      - name: Speed gate (production build)
        id: speed
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          MXR_KEY_TO_PAINT_BUDGET_MS: 75
        run: npm run e2e:perf -- --workers=1 --output=test-results-speed
      - name: Upload speed traces
        if: ${{ !cancelled() && steps.speed.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-speed-results
          path: apps/web/test-results-speed
          retention-days: 3

  coverage:
    name: Coverage
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      # Restore the library report from before package consolidation (b83b9e6).
      # The crates returned in 09fba614, but the old 90/75 thresholds were left
      # measuring only the daemon. Run its integration tests for library coverage.
      # cmd:// children can stop during profile writing; merge complete samples.
      - run: >
          cargo llvm-cov
          --failure-mode all
          --package mxr-compose
          --package mxr-provider-gmail
          --package mxr-provider-imap
          --package mxr-provider-smtp
          --package mxr-reader
          --package mxr-export
          --package mxr-sync
          --package mxr
          --exclude-from-report mxr
          --features semantic-local
          --ignore-filename-regex 'crates/provider-gmail/src/(auth|client)\.rs|crates/provider-imap/src/session\.rs'
          --summary-only
          --fail-under-lines 90
          --fail-under-regions 75
      - name: Inspect raw coverage profiles after failure
        if: failure()
        run: |
          echo "llvm-profdata version:"
          rustc_host=$(rustc -vV | sed -n 's/^host: //p')
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/$rustc_host/bin/llvm-profdata"
          "$llvm_profdata" --version || true
          echo "profile list:"
          cat target-cli/llvm-cov-target/mxr-profraw-list || true
          for profile in target-cli/llvm-cov-target/*.profraw; do
            [ -f "$profile" ] || continue
            bytes=$(wc -c < "$profile" || true)
            header=$(od -An -tx1 -N16 "$profile" | tr -d ' \n' || true)
            echo "profile=$profile bytes=$bytes header=$header"
          done
      - name: Upload raw coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-profiles
          path: |
            target-cli/llvm-cov-target/*.profraw
            target-cli/llvm-cov-target/mxr-profraw-list
            target-cli/llvm-cov-target/mxr.profdata
          if-no-files-found: warn
          retention-days: 3

  sqlx:
    name: SQLx Offline
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls
      - run: |
          db_path="${RUNNER_TEMP}/mxr-sqlx-check.db"
          rm -f "$db_path"
          cargo run -p mxr-store --example create_db -- "$db_path"
          DATABASE_URL="sqlite:${db_path}" cargo sqlx prepare --check --workspace

  docs:
    name: Docs Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.expensive == 'true'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: node ../scripts/check-npm-audit.mjs audit-allowlist.json
      - run: npm run build

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.expensive == 'true'
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo build --workspace --release

  rustdoc:
    name: Rustdoc
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    # Runs on Rust changes, not just expensive/dispatch runs: -Dwarnings
    # rustdoc is the only gate that catches broken intra-doc links, and
    # gating it behind `expensive` let doc rot land undetected.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.expensive == 'true'
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV (${{ needs.changes.outputs.rust_version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.changes.outputs.rust_version }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo check --workspace --locked

  install-check:
    name: Install Smoke Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.expensive == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - run: cargo install --path . --locked --root "$RUNNER_TEMP/mxr-install"
      - run: |
          "$RUNNER_TEMP/mxr-install/bin/mxr" version
          test -x "$RUNNER_TEMP/mxr-install/bin/mxr-chime-player"
