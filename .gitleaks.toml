title = "mxr gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Git blob checksum recorded in the S06 source manifest"
  condition = "AND"
  paths = ['''(^|/)docs/build-log/daemon-portability/evidence/s06-event-recovery-audit-2c55a735\.json$''']
  regexTarget = "secret"
  regexes = ['''^80aadc8c5f301179fcb7666f6361f5a7227fb0dd$''']

  [[rules.allowlists]]
  description = "Public WebSocket handshake nonce in the gateway fixture"
  condition = "AND"
  paths = ['''(^|/)crates/web/src/remote_gateway_tests\.rs$''']
  regexTarget = "secret"
  regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

  [[rules.allowlists]]
  description = "RFC 6455 example nonce in the hosting probe's earlier commit"
  condition = "AND"
  paths = ['''(^|/)crates/daemon/src/commands/serve/hosting\.rs$''']
  regexTarget = "secret"
  regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Throwaway self-signed TLS key for the IMAP transport tests; protects nothing"
  paths = ['''(^|/)crates/provider-imap/src/test_fixtures/test-server\.key\.pem$''']
